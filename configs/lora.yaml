model:
  latent_dim: 32
  latent_patch_size: 1

  text_vocab_size: 64000
  text_tokenizer_repo: sherif1313/arabic-tokenizer-tts

  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875

  text_mlp_ratio: 2.6
  speaker_mlp_ratio: 2.6

  # 🔥 مهم جدًا (لازم 768 عشان AraBERT)
  text_dim: 768
  text_layers: 10
  text_heads: 8

  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 1

  timestep_embed_dim: 512
  adaln_rank: 192

  # ✅ إصلاح مشكلة BOS
  text_add_bos: false
  caption_add_bos: false


train:
  batch_size: 12
  gradient_accumulation_steps: 4
  num_workers: 16
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  allow_tf32: true
  compile_model: false
  precision: fp32 #bf16
  optimizer: adamw
  learning_rate:  2.0e-5 #0.000005
  weight_decay: 0.01
  lr_scheduler: wsd
  warmup_steps: 400
  stable_steps: 44000
  min_lr_scale: 0.01
  max_steps: 50000
  max_text_len: 256
  text_condition_dropout: 0.1
  speaker_condition_dropout: 0.1
  timestep_stratified: true
  max_latent_steps: 750
  fixed_target_latent_steps: 750
  fixed_target_full_mask: true
  log_every: 100
  save_every: 100
  checkpoint_best_n: 5
  wandb_enabled: false
  ddp_find_unused_parameters: false
  valid_ratio: 0.01
  valid_every: 1000
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  lora_target_modules: diffusion_full #diffusion_attn_mlp
  seed: 0
